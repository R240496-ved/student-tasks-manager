<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Student Task Manager home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Student Task Manager</span>
      </a>
      <span class="connection" id="connection-status"><span class="connection-dot"></span> Connecting…</span>
    </header>

    <main class="page-shell">
      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">YOUR WORKSPACE</p>
          <h1 id="page-title">Task dashboard</h1>
          <p class="subtitle">Keep your coursework clear and moving forward.</p>
        </div>
        <button class="button button-primary heading-action" id="new-task-button" type="button">＋ New task</button>
      </section>

      <div class="workspace">
        <section class="panel form-panel" id="form-panel" aria-labelledby="form-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow" id="form-eyebrow">GET STARTED</p>
              <h2 id="form-title">Create a task</h2>
            </div>
            <span class="form-icon" aria-hidden="true">✎</span>
          </div>
          <form id="task-form">
            <label for="title">Title <span class="required">*</span></label>
            <input id="title" name="title" type="text" maxlength="200" placeholder="e.g. Finish data structures assignment" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Add a few details to help you get started"></textarea>

            <div class="field-row">
              <div>
                <label for="status">Status</label>
                <select id="status" name="status">
                  <option value="pending">Pending</option>
                  <option value="in progress">In progress</option>
                  <option value="done">Done</option>
                </select>
              </div>
              <div>
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                  <option value="low">Low</option>
                </select>
              </div>
            </div>

            <label for="deadline">Deadline</label>
            <input id="deadline" name="deadline" type="date">

            <p class="form-error" id="form-error" role="alert" hidden></p>
            <div class="form-actions">
              <button class="button button-primary submit-button" id="submit-button" type="submit">Create task</button>
              <button class="button button-quiet" id="cancel-edit" type="button" hidden>Cancel</button>
            </div>
          </form>
          <p class="form-note"><span class="required">*</span> Required field</p>
        </section>

        <section class="panel tasks-panel" aria-labelledby="tasks-title">
          <div class="tasks-heading">
            <div>
              <p class="eyebrow">STAY ON TRACK</p>
              <h2 id="tasks-title">Your tasks <span class="task-count" id="task-count">0</span></h2>
            </div>
            <button class="icon-button" id="refresh-button" type="button" title="Refresh tasks" aria-label="Refresh tasks">↻</button>
          </div>
          <div class="load-error" id="load-error" role="alert" hidden></div>
          <div class="task-list" id="task-list" aria-live="polite" aria-busy="false">
            <div class="loading-state"><span class="spinner" aria-hidden="true"></span> Loading tasks…</div>
          </div>
        </section>
      </div>
      <footer>Small steps add up. Keep going.</footer>
    </main>
  </body>
</html>
