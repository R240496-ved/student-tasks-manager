services:
  backend:
    build:
      context: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_PATH: /data/tasks.db
    ports:
      - "5000:5000"
    volumes:
      - task_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/tasks', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 8000
      TASK_API_HOST: backend
      TASK_API_PORT: 5000
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  task_data:
